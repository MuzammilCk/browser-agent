<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation — BharatGov</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&subset=devanagari&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #F4F5F6;
            --surface: #FFFFFF;
            --ink: #1B1F2A;
            --ink-muted: #5B6472;
            --indigo: #2C4472;
            --marigold: #C8862B;
            --verified: #2F6F4E;
            --attention: #A23B3B;

            --border: #E3E6EA;
            --border-strong: #D3D8DF;
            --indigo-tint: rgba(44, 68, 114, 0.08);
            --marigold-tint: rgba(200, 134, 43, 0.10);
            --verified-tint: rgba(47, 111, 78, 0.10);
            --attention-tint: rgba(162, 59, 59, 0.10);

            --font-display: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;

            --space-2xs: 4px;
            --space-xs: 8px;
            --space-sm: 12px;
            --space-md: 16px;
            --space-lg: 24px;

            --radius: 8px;
            --radius-sm: 6px;
            --transition-base: 160ms ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body {
            font-family: var(--font-body);
            background: var(--paper);
            color: var(--ink);
            min-height: 100dvh;
            line-height: 1.55;
            font-size: 1rem;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
        :focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; border-radius: var(--radius-sm); }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-md);
            padding: var(--space-sm) var(--space-lg);
            background: var(--surface);
            border-bottom: 1px solid var(--border-strong);
            flex-shrink: 0;
        }
        .topbar-id { display: flex; align-items: center; gap: var(--space-sm); min-width: 0; }
        .topbar-id h1 {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--ink);
        }
        .topbar-meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--ink-muted);
            white-space: nowrap;
        }
        .badge {
            padding: 2px var(--space-sm);
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: 1px solid var(--border-strong);
            color: var(--ink-muted);
            background: transparent;
            flex-shrink: 0;
        }
        .status-running { background: var(--indigo-tint); color: var(--indigo); border-color: transparent; }
        .status-completed { background: var(--verified-tint); color: var(--verified); border-color: transparent; }
        .status-failed { background: var(--attention-tint); color: var(--attention); border-color: transparent; }
        .status-waiting { background: transparent; color: var(--ink-muted); }

        .btn {
            padding: 0.45rem 0.95rem;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-body);
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            text-decoration: none;
        }
        .btn-danger { background: var(--attention); color: #fff; }
        .btn-danger:hover { background: #8c3232; }
        .btn-secondary { background: transparent; color: var(--ink); border-color: var(--border-strong); }
        .btn-secondary:hover { border-color: var(--ink-muted); }
        .btn-primary { background: var(--indigo); color: #fff; }
        .btn-primary:hover { background: #243a61; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

        .layout { display: flex; flex: 1; min-height: 0; }

        .stage {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: var(--space-md);
            gap: var(--space-md);
            overflow: hidden;
        }

        /* ── Handoff card (marigold) ── */
        .handoff-card {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 3px solid var(--marigold);
            border-radius: var(--radius);
            padding: 0.9rem 1rem 1rem;
            animation: handoffIn var(--transition-base) ease;
        }
        .handoff-card.active { display: block; }
        @keyframes handoffIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .handoff-head {
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: var(--space-2xs);
        }
        .handoff-desc {
            font-size: 0.9375rem;
            color: var(--ink-muted);
            margin-bottom: 0.7rem;
            word-break: break-word;
            line-height: 1.5;
        }
        .handoff-actions { display: flex; gap: var(--space-sm); }

        /* ── Task box ── */
        .task-box {
            padding: var(--space-sm) var(--space-md);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.9375rem;
            color: var(--ink-muted);
            flex-shrink: 0;
        }
        .task-box .label {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-muted);
            margin-bottom: 2px;
        }
        .task-box .value { color: var(--ink); }

        /* ── Browser chrome frame ── */
        .screenshot-wrap {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .chrome-bar {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-xs) var(--space-md);
            border-bottom: 1px solid var(--border);
            background: var(--paper);
            flex-shrink: 0;
        }
        .chrome-dots { display: flex; gap: 6px; flex-shrink: 0; }
        .chrome-dots span {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--border-strong);
            display: block;
        }
        .chrome-url {
            flex: 1;
            min-width: 0;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--ink-muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            padding: 4px var(--space-md);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chrome-shot {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-sm);
            overflow: hidden;
        }
        .chrome-shot img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: var(--radius-sm);
        }
        .placeholder { color: var(--ink-muted); font-size: 0.9375rem; }

        /* ── Trace ledger ── */
        .sidebar {
            width: 360px;
            flex-shrink: 0;
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding: var(--space-md);
            background: var(--paper);
        }
        .trace-title {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: var(--space-sm);
        }
        .trace-empty { font-size: 0.9375rem; color: var(--ink-muted); }
        .trace-row {
            display: flex;
            gap: var(--space-sm);
            padding: var(--space-xs) 0 var(--space-sm);
            border-left: 2px solid transparent;
            padding-left: var(--space-sm);
            margin-left: -2px;
            border-bottom: 1px solid var(--border);
            color: var(--ink-muted);
            animation: traceIn var(--transition-base) ease;
        }
        .trace-row:last-child { border-bottom: none; }
        @keyframes traceIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .trace-row.current { border-left-color: var(--indigo); color: var(--ink); }
        .trace-num {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--ink-muted);
            padding-top: 1px;
            flex-shrink: 0;
            min-width: 18px;
        }
        .trace-main { flex: 1; min-width: 0; }
        .trace-top { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: 2px; }
        .trace-label {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: var(--ink-muted);
            text-transform: uppercase;
        }
        .trace-chip {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            padding: 1px 6px;
            border-radius: var(--radius-full);
        }
        .trace-chip.ok { color: var(--verified); background: var(--verified-tint); }
        .trace-chip.bad { color: var(--attention); background: var(--attention-tint); }
        .trace-chip.needs { color: var(--marigold); background: var(--marigold-tint); }
        .trace-text { font-size: 0.9375rem; color: var(--ink); line-height: 1.45; }
        .trace-row:not(.current) .trace-text { color: var(--ink-muted); }
        .trace-msg { font-size: 0.8125rem; color: var(--ink-muted); margin-top: 2px; line-height: 1.45; }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 40vh; }
            .btn { min-height: 44px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-id">
            <h1 id="wfDomain">Automation</h1>
            <span class="badge status-running" id="wfBadge" aria-live="polite">Starting</span>
            <span class="topbar-meta" id="wfMeta" aria-live="polite"></span>
        </div>
        <div style="display:flex;gap:0.5rem;">
            <button class="btn btn-danger" id="stopBtn" onclick="abort()">Stop</button>
        </div>
    </div>
    <div class="layout">
        <div class="stage">
            <div class="handoff-card" id="confirmBox" role="alert">
                <div class="handoff-head">Your action is needed</div>
                <div class="handoff-desc" id="confirmDesc"></div>
                <div class="handoff-actions">
                    <button class="btn btn-primary" onclick="confirmPending(true)">Approve &amp; continue</button>
                    <button class="btn btn-secondary" onclick="confirmPending(false)">Decline</button>
                </div>
            </div>
            <div class="task-box">
                <div class="label">Task</div>
                <div class="value" id="wfTask">—</div>
            </div>
            <div class="screenshot-wrap" id="screenshotWrap" aria-label="Automation screenshot">
                <div class="chrome-bar">
                    <div class="chrome-dots" aria-hidden="true"><span></span><span></span><span></span></div>
                    <div class="chrome-url" id="wfUrl">about:blank</div>
                </div>
                <div class="chrome-shot">
                    <div class="placeholder">Waiting for screenshot...</div>
                </div>
            </div>
        </div>
        <aside class="sidebar" role="log" aria-label="Automation trace" aria-live="polite">
            <div class="trace-title">Trace</div>
            <div id="logList"><div class="trace-empty">No steps yet.</div></div>
        </aside>
    </div>

    <script>
        const parts = window.location.pathname.split('/').filter(Boolean);
        const workflowId = decodeURIComponent(parts[parts.length - 1]);
        let finished = false;
        let pollTimer = null;
        let traceRendered = 0;

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function setBadge(status) {
            const badge = document.getElementById('wfBadge');
            badge.textContent = status;
            if (['running', 'starting', 'launching_browser', 'navigating'].includes(status)) {
                badge.className = 'badge status-running';
            } else if (status === 'completed') {
                badge.className = 'badge status-completed';
            } else if (status === 'failed' || status === 'aborted') {
                badge.className = 'badge status-failed';
            } else if (status.includes('waiting') || status === 'ready_for_confirmation' || status === 'ready_for_submission') {
                badge.className = 'badge status-waiting';
            } else {
                badge.className = 'badge status-running';
            }
        }

        function appendTrace(steps) {
            const el = document.getElementById('logList');
            if (el.querySelector('.trace-empty')) el.innerHTML = '';
            const prev = el.querySelector('.trace-row.current');
            if (prev) prev.classList.remove('current');

            steps.forEach(s => {
                const row = document.createElement('div');
                row.className = 'trace-row' + (s.kind === 'needs' ? ' needs' : '');
                const chip = s.kind === 'needs'
                    ? '<span class="trace-chip needs">NEEDS YOU</span>'
                    : s.ok
                        ? '<span class="trace-chip ok">VERIFIED</span>'
                        : '<span class="trace-chip bad">FAILED</span>';
                const label = s.kind === 'needs' ? 'NEEDS YOU' : 'DID';
                row.innerHTML = `
                    <div class="trace-num">${String(s.n).padStart(2, '0')}</div>
                    <div class="trace-main">
                        <div class="trace-top"><span class="trace-label">${label}</span>${chip}</div>
                        <div class="trace-text">${escapeHtml(s.text)}</div>
                        ${s.msg ? `<div class="trace-msg">${escapeHtml(s.msg)}</div>` : ''}
                    </div>`;
                el.appendChild(row);
            });

            const rows = el.querySelectorAll('.trace-row');
            if (rows.length) rows[rows.length - 1].classList.add('current');
            el.scrollTop = el.scrollHeight;
        }

        function buildSteps(wf) {
            const steps = [];
            const actions = wf.actions || [];
            actions.forEach((a, i) => {
                steps.push({ n: i + 1, kind: 'did', text: `${a.type || ''} ${a.target || ''}`.trim(), msg: a.message || '', ok: a.success });
            });
            const base = actions.length;
            (wf.checkpoints || []).forEach((cp, i) => {
                steps.push({ n: base + i + 1, kind: 'needs', text: String(cp), msg: '', ok: null });
            });
            if (wf.error) {
                steps.push({ n: steps.length + 1, kind: 'err', text: wf.error, msg: '', ok: false });
            }
            return steps;
        }

        async function poll() {
            if (!workflowId || finished) return;
            try {
                const res = await fetch(`/api/automate/${encodeURIComponent(workflowId)}`);
                const wf = await res.json();
                if (wf.error) {
                    document.getElementById('wfTask').textContent = wf.error;
                    stopPoll();
                    return;
                }

                document.title = `${wf.domain} — ${wf.status} — BharatGov`;
                document.getElementById('wfDomain').textContent = wf.domain;
                document.getElementById('wfTask').textContent = wf.task || '—';
                document.getElementById('wfUrl').textContent = wf.current_url || 'about:blank';
                setBadge(wf.status);
                document.getElementById('wfMeta').textContent =
                    wf.total_actions ? `${wf.successful_actions}/${wf.total_actions} actions` : '';

                const box = document.getElementById('confirmBox');
                if (wf.status === 'ready_for_confirmation' && wf.pending_action) {
                    const pa = wf.pending_action;
                    document.getElementById('confirmDesc').textContent =
                        `${pa.action}${pa.target_ref ? ' on ' + pa.target_ref : ''}` +
                        (pa.value_ref ? ` (${pa.value_ref})` : '') +
                        (pa.reason ? ` — ${pa.reason}` : '');
                    box.classList.add('active');
                } else {
                    box.classList.remove('active');
                }

                const steps = buildSteps(wf);
                if (steps.length > traceRendered) {
                    appendTrace(steps.slice(traceRendered));
                    traceRendered = steps.length;
                }

                const wrap = document.querySelector('.chrome-shot');
                if (wf.screenshot_count > 0 && !finished) {
                    const img = wrap.querySelector('img');
                    if (!img) {
                        wrap.innerHTML = `<img src="/api/automate/${encodeURIComponent(workflowId)}/screenshot?step=latest" alt="Automation screenshot" />`;
                    } else {
                        img.src = `/api/automate/${encodeURIComponent(workflowId)}/screenshot?step=latest&t=${Date.now()}`;
                    }
                }

                if (wf.finished) stopPoll();
            } catch (e) {
                console.error('Poll error:', e);
            }
        }

        function stopPoll() {
            finished = true;
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            document.getElementById('stopBtn').disabled = true;
        }

        async function abort() {
            try { await fetch(`/api/automate/${encodeURIComponent(workflowId)}/abort`, { method: 'POST' }); } catch (e) {}
        }

        async function confirmPending(approved) {
            try {
                await fetch(`/api/automate/${encodeURIComponent(workflowId)}/confirm`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ approved }),
                });
                document.getElementById('confirmBox').classList.remove('active');
            } catch (e) {}
        }

        if (!workflowId || /^[0-9a-f]{8}$/i.test(workflowId) === false) {
            document.getElementById('wfTask').textContent = 'Invalid workflow id in URL.';
        } else {
            poll();
            pollTimer = setInterval(poll, 1500);
        }
    </script>
</body>
</html>
