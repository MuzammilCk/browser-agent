[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "government-browser-agent"
version = "0.1.0"
description = "Semantic browser agent for government form filling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.50.0,<2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "synthetic: Synthetic form tests",
    "safety: Safety tests",
    "injection: Prompt injection tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
