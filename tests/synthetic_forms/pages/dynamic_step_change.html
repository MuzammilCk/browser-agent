<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Application</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
        .stage { display: none; }
        .stage.active { display: block; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.25rem; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.75rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; background: #2563eb; color: white; }
        .notice { background: #fef9c3; border: 1px solid #fde047; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h1>Dynamic Service Application</h1>

    <!-- Stage 1: personal + contact (original section layout) -->
    <div class="stage active" id="stage1">
        <h2>Step 1: Your Details</h2>
        <div class="form-group">
            <label for="app_full_name">Full Name</label>
            <input type="text" id="app_full_name" name="full_name" required>
        </div>
        <div class="form-group">
            <label for="app_email">Email</label>
            <input type="email" id="app_email" name="email" required>
        </div>
        <button type="button" id="btn_continue" onclick="showStage(2)">Continue &rarr;</button>
    </div>

    <!-- Stage 2: REPLACED section layout — email section is gone,
         phone + address fields appear instead (the "page change" that
         invalidates the contact-filling subgoal). -->
    <div class="stage" id="stage2">
        <h2>Step 2: Contact (updated section)</h2>
        <div class="notice">Section layout updated: please provide phone and address.</div>
        <div class="form-group">
            <label for="app_phone">Phone</label>
            <input type="tel" id="app_phone" name="phone" required>
        </div>
        <div class="form-group">
            <label for="app_address">Address</label>
            <input type="text" id="app_address" name="address" required>
        </div>
        <button type="button" id="btn_review" onclick="showStage(3)">Review &rarr;</button>
    </div>

    <!-- Stage 3: review -->
    <div class="stage" id="stage3">
        <h2>Step 3: Review your application</h2>
        <p id="review_summary">Please review your details before submitting.</p>
        <button type="button" id="btn_submit">Submit Application</button>
    </div>

    <script>
        function showStage(n) {
            document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
            document.getElementById('stage' + n).classList.add('active');
        }
    </script>
</body>
</html>
