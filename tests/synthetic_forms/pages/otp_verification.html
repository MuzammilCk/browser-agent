<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Citizen Service Portal - OTP Verification</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f8; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #0056b3; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #004085; }
        .hidden { display: none; }
        .success-msg { color: #155724; background: #d4edda; padding: 12px; border-radius: 4px; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Income Certificate Application</h2>

        <!-- Step 1: Personal Details -->
        <div id="step1">
            <div class="form-group">
                <label for="fullname">Applicant Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="text" id="mobile" name="mobile" placeholder="10-digit mobile">
            </div>
            <button type="button" id="btn_generate_otp" onclick="triggerOtp()">Generate OTP</button>
        </div>

        <!-- Step 2: OTP Challenge (revealed dynamically) -->
        <div id="step2" class="hidden">
            <p style="color: #666;">An OTP has been sent to your mobile number.</p>
            <div class="form-group">
                <label for="otp">Enter 6-Digit OTP</label>
                <input type="text" id="otp" name="otp" placeholder="6-digit OTP">
            </div>
            <button type="button" id="btn_verify_otp" onclick="verifyOtp()">Verify & Submit Application</button>
        </div>

        <!-- Step 3: Success Confirmation -->
        <div id="step3" class="hidden">
            <div class="success-msg" id="success_banner">
                <h3>Application Submitted Successfully!</h3>
                <p>Acknowledgment Reference: <strong>ACK-IND-8829</strong></p>
            </div>
            <button type="button" id="btn_download" onclick="downloadAck()">Download Acknowledgment</button>
            <div id="download_msg" class="hidden" style="margin-top: 10px; color: #0056b3;">Receipt Downloaded</div>
        </div>
    </div>

    <script>
        function downloadAck() {
            var btn = document.getElementById('btn_download');
            btn.disabled = true;
            btn.innerText = 'Downloaded';
            document.getElementById('download_msg').classList.remove('hidden');
        }
        function triggerOtp() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function verifyOtp() {
            var val = document.getElementById('otp').value.trim();
            if (val === "987654") {
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
            } else {
                alert("Invalid OTP");
            }
        }
    </script>
</body>
</html>
