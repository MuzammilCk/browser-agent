<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form with File Input and Iframe</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.25rem; }
        input[type="file"] { margin-bottom: 0.5rem; }
        iframe { width: 100%; height: 100px; border: 1px solid #ccc; }
        button { padding: 0.75rem 1.5rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Document Upload Form</h1>
    <form id="uploadForm">
        <div class="form-group">
            <label for="photo">Passport Photo</label>
            <input type="file" id="photo" name="photo"
                   aria-label="Upload Passport Photo"
                   accept=".jpg,.jpeg,.png" required>
            <div class="help-text">JPG or PNG, max 2MB</div>
        </div>

        <div class="form-group">
            <label for="aadhaar">Aadhaar Card</label>
            <input type="file" id="aadhaar" name="aadhaar"
                   aria-label="Upload Aadhaar Card"
                   accept=".pdf,.jpg,.jpeg,.png">
        </div>

        <button type="submit">Submit</button>
    </form>

    <h2>Embedded Content</h2>
    <iframe id="embeddedFrame" src="about:blank" title="Embedded Government Portal"></iframe>
</body>
</html>
