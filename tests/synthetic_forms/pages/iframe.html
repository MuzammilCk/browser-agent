<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page with Iframe</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.25rem; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        iframe { width: 100%; height: 150px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Form with Embedded Iframe</h1>
    <form id="mainForm">
        <div class="form-group">
            <label for="fullName">Applicant Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="reference">Reference Number</label>
            <input type="text" id="reference" name="reference" placeholder="Enter reference number">
        </div>
    </form>

    <h2>Embedded Content</h2>
    <iframe id="embed" src="about:blank" title="Embedded reference frame"></iframe>
</body>
</html>
